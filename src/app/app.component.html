<header class="header">
  <h1 class="title">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
      <path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z" fill="currentColor" />
    </svg>
    ScubaFix
  </h1>
  <p class="tagline">Bring back the reds in underwater photos. Everything runs on your device.</p>
</header>

<main class="main">
  @if (library.selected(); as image) {
    <app-image-preview [file]="image.file" />
  } @else {
    <section class="empty" aria-labelledby="empty-title">
      <svg class="empty-icon" viewBox="0 0 24 24" width="56" height="56" aria-hidden="true">
        <path
          d="M4 5h16v14H4zM4 15l4-4 4 4 3-3 5 5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linejoin="round"
        />
        <circle cx="15.5" cy="8.5" r="1.5" fill="currentColor" />
      </svg>
      <h2 id="empty-title" class="empty-title">Add a photo to get started</h2>
      <p class="empty-hint">Drop images anywhere, paste from your clipboard, or</p>
      <button type="button" class="btn primary" (click)="openPicker()">Choose photos</button>
    </section>
  }
</main>

<footer class="footer" [class.collapsed]="library.images().length === 0">
  <app-image-tray (skipped)="showSkipped($event)" />
</footer>

<p class="notice" role="status">{{ notice() }}</p>

@if (dragging()) {
  <div class="drop-overlay" aria-hidden="true">
    <p>Drop photos to add them</p>
  </div>
}
