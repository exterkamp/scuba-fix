<div class="stage" [attr.aria-busy]="!rendered()">
  <canvas
    #canvas
    class="image"
    [class.hidden]="!rendered()"
    role="img"
    [attr.aria-label]="(comparing() ? 'Original: ' : 'Corrected: ') + file().name"
    (pointerdown)="startCompare($event)"
    (pointerup)="endCompare()"
    (pointercancel)="endCompare()"
    (lostpointercapture)="endCompare()"
    (contextmenu)="$event.preventDefault()"
  ></canvas>

  @if (errorMessage(); as message) {
    <p class="overlay error" role="alert">{{ message }}</p>
  } @else if (!rendered()) {
    <div class="overlay">
      <span class="spinner" aria-hidden="true"></span>
      <span>Analyzing…</span>
    </div>
  } @else {
    <span class="badge" [class.original]="comparing()" aria-hidden="true">
      {{ comparing() ? 'Original' : 'Corrected' }}
    </span>
    @if (rendering()) {
      <span class="busy" aria-hidden="true"><span class="spinner small"></span></span>
    }
  }
</div>

<div class="controls">
  <fieldset class="method" [disabled]="!ready()">
    <legend class="sr-only">Correction method</legend>
    <label title="Fast hue shift and levels stretch. Usually best in clear blue water.">
      <input type="radio" name="method" value="classic" [checked]="method() === 'classic'" (change)="setMethod('classic')" />
      Classic
    </label>
    <label title="Ancuti color balance and fusion. Often better for deep, green or murky water.">
      <input type="radio" name="method" value="fusion" [checked]="method() === 'fusion'" (change)="setMethod('fusion')" />
      Fusion
    </label>
  </fieldset>

  <label class="slider" title="Double-click to reset">
    <span class="slider-label">Strength</span>
    <input
      type="range"
      min="0"
      max="100"
      [value]="strength()"
      [disabled]="!ready()"
      (input)="strength.set(sliderValue($event))"
      (dblclick)="strength.set(100)"
    />
    <span class="slider-value" aria-hidden="true">{{ strength() }}%</span>
  </label>

  <label class="slider" title="Local contrast. Double-click to reset">
    <span class="slider-label">Clarity</span>
    <input
      type="range"
      min="0"
      max="100"
      [value]="clarity()"
      [disabled]="!ready()"
      (input)="clarity.set(sliderValue($event))"
      (dblclick)="clarity.set(0)"
    />
    <span class="slider-value" aria-hidden="true">{{ clarity() }}%</span>
  </label>

  <div class="actions">
    <button
      type="button"
      class="btn"
      [attr.aria-pressed]="comparing()"
      [disabled]="!rendered()"
      (pointerdown)="startCompare($event)"
      (pointerup)="endCompare()"
      (pointercancel)="endCompare()"
      (lostpointercapture)="endCompare()"
      (keydown)="compareKey($event, true)"
      (keyup)="compareKey($event, false)"
      (blur)="endCompare()"
      (contextmenu)="$event.preventDefault()"
    >
      Hold to compare
    </button>

    <button type="button" class="btn primary" [disabled]="!ready() || downloading()" (click)="download()">
      @if (downloading()) {
        <span class="spinner small" aria-hidden="true"></span> Saving…
      } @else {
        Download full size
      }
    </button>
  </div>
</div>

@if (downloadError(); as message) {
  <p class="download-error" role="alert">{{ message }}</p>
}
